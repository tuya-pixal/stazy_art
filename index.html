<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stazy Wassy Art</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    background: linear-gradient(120deg, #7b39ff, #c5b3f2, #ff7bcb, #ffb37b);
    background-size: 800% 800%;
    animation: gradientShift 20s ease infinite;
  }

  @keyframes gradientShift {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  header {
    text-align: center;
    padding: 2rem;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
  }

  header h1 {
    font-size: 3rem;
    color: #7b39ff;
  }

  .gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2rem;
    padding: 2rem;
  }

  .gallery img {
    width: 300px;
    height: 300px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .gallery img:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 35px rgba(255,255,255,0.6);
  }

  .footer {
    text-align: center;
    margin: 3rem 0;
  }

  /* Contact button */
  .footer button {
    padding: 1rem 2rem;
    border: none;
    border-radius: 10px;
    font-size: 1.2rem;
    cursor: pointer;
    color: white;
    background: linear-gradient(45deg, #7b39ff, #c5b3f2, #ff7bcb, #ffb37b);
    background-size: 400% 400%;
    animation: buttonGradient 4s ease infinite, pulse 2s infinite;
    transition: all 0.3s ease;
  }

  .footer button:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 10px 25px rgba(255,123,203,0.8);
  }

  @keyframes buttonGradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 10px rgba(123,57,255,0.4); }
    50% { box-shadow: 0 0 25px rgba(255,123,203,0.8); }
    100% { box-shadow: 0 0 10px rgba(123,57,255,0.4); }
  }

  /* Hidden contact options */
  #contact-options {
    margin-top: 1rem;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: all 0.4s ease;
  }

  #contact-options.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Animated buttons (Discord + Bluesky) */
  #contact-options a {
    display: inline-block;
    margin: 0.5rem;
    padding: 0.7rem 1.5rem;
    background: linear-gradient(45deg, #7b39ff, #c5b3f2, #ff7bcb, #ffb37b);
    background-size: 400% 400%;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    animation: buttonGradient 4s ease infinite;
    transition: all 0.3s ease;
  }

  #contact-options a:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 20px rgba(255,123,203,0.8);
  }

  @media(max-width: 1000px) {
    .gallery img {
      width: 80%;
      height: auto;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Stazy Wassy Art</h1>
</header>

<div class="gallery">
  <img src="stazy1.jpg" alt="">
  <img src="stazy2.jpg" alt="">
  <img src="stazy3.jpg" alt="">
</div>

<div class="footer">
  <button onclick="toggleContact()">Contact Us</button>

  <div id="contact-options">
    <a href="https://discord.gg/NZWScghu2" target="_blank">Discord</a>
    <a href="https://bsky.app/profile/staz1994.bsky.social" target="_blank">Bluesky</a>
  </div>
</div>

<script>
function toggleContact() {
  const box = document.getElementById("contact-options");
  box.classList.toggle("show");
}
</script>

</body>
</html>
